<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>B-SIDE | Asian Food After Hours</title>

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Concert+One&family=Fredoka:wght@300..700&family=Lilita+One&family=Titan+One&display=swap"
      rel="stylesheet"
    />

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- Iconos -->
    <script
      src="https://kit.fontawesome.com/c3fd22b8e3.js"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <header class="cabecera">
      <a href="#inicio" class="logo">
        <img src="img/B-SIDE.png" alt="Logo de B-SIDE" />
      </a>

      <!-- ENLACES DE NAVEGACIÓN -->
      <nav class="navegacion" aria-label="Navegación principal">
        <a href="#inicio" class="enlace activo">Inicio</a>

        <a href="#carta" class="enlace">Carta</a>

        <a href="#reservas" class="enlace">Reservas</a>

        <a href="#nosotros" class="enlace">Sobre Nosotros</a>

        <a href="#contacto" class="enlace">Contacto</a>
      </nav>

      <!-- BOTÓN DE RESERVAS -->
      <a href="#reservas" class="boton-reserva">
        <i class="fa-regular fa-calendar"></i>
        Reservar Mesa
      </a>
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
      <section class="inicio" id="inicio">
        <!-- Aquí irá el contenido principal de la portada -->
        <div class="texto-inicio">
          <h1>
            Sabores de Asia,<br />
            hasta tarde
          </h1>
        </div>
        <img src="img/logo.png" alt="Mascota B-SIDE" class="gato" />
        <a href="#carta" class="boton-carta">
          Explora nuestra carta
          <i class="fa-solid fa-arrow-right"></i>
        </a>
      </section>
    </main>
  </body>
</html>
